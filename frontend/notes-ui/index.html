<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📝</span>
          <span class="logo-text">Notes</span>
        </div>
        <button id="new-note-btn" class="new-note-btn">+ New Note</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search notes..." />
      </div>
      <ul id="notes-list" class="notes-list"></ul>
      <div class="sidebar-footer">
        <span id="notes-count">0 notes</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Empty state -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🗒️</div>
        <h2>No note selected</h2>
        <p>Select a note from the sidebar or create a new one.</p>
        <button id="empty-new-btn" class="btn-primary">Create your first note</button>
      </div>

      <!-- Editor -->
      <div id="editor" class="editor hidden">
        <div class="editor-header">
          <input type="text" id="note-title" class="title-input" placeholder="Note title..." />
          <div class="editor-actions">
            <button id="save-btn" class="btn-primary">Save</button>
            <button id="delete-btn" class="btn-danger">Delete</button>
          </div>
        </div>
        <div class="editor-meta" id="editor-meta"></div>
        <textarea id="note-content" class="content-input" placeholder="Write your note here..."></textarea>
      </div>
    </main>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
